# Deployment on a shared VPS that already runs nginx on ports 80/443.
# The app listens only on 127.0.0.1:${APP_PORT}; the host nginx proxies the domain to it
# (see deploy/nginx-jiran.conf). Usage: docker compose up -d --build

name: jiran

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/data/prod.db"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    volumes:
      - ./storage:/data
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"

  # Consistent daily snapshot of the database, kept for 14 days in ./storage/backups
  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - ./storage:/data
    command:
      - sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          if [ -f /data/prod.db ]; then
            mkdir -p /data/backups
            sqlite3 /data/prod.db ".backup /data/backups/prod-$$(date +%F).db"
            find /data/backups -name 'prod-*.db' -mtime +14 -delete
          fi
          sleep 86400
        done
