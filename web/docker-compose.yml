# VPS deployment: app + automatic HTTPS (Caddy) + daily SQLite backups.
# Usage: cp .env.example .env  -> set DOMAIN -> docker compose up -d --build

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/data/prod.db"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    volumes:
      - ./storage:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Consistent daily snapshot of the database, kept for 14 days in ./storage/backups
  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - ./storage:/data
    command:
      - sh
      - -c
      - |
        apk add --no-cache sqlite >/dev/null
        while true; do
          if [ -f /data/prod.db ]; then
            mkdir -p /data/backups
            sqlite3 /data/prod.db ".backup /data/backups/prod-$$(date +%F).db"
            find /data/backups -name 'prod-*.db' -mtime +14 -delete
          fi
          sleep 86400
        done

volumes:
  caddy_data:
  caddy_config:
