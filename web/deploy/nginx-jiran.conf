# Separate nginx site for this app. It does not touch the existing jumanlady.com config.
# Replace JIRAN_DOMAIN with the real domain, then let certbot add the HTTPS part:
#   certbot --nginx -d JIRAN_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name JIRAN_DOMAIN;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
