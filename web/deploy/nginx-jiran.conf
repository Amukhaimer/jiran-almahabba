# Reference copy of the live nginx vhosts for https://jiran.jumanlady.com
# On the server these are two files in /etc/nginx/conf.d/vhosts/:
#   jiran.jumanlady.com.conf      (port 80 block)
#   jiran.jumanlady.com.ssl.conf  (port 443 block)
# Certificate: acme.sh (webroot /usr/local/apache/autossl_tmp), auto-renewed.

server {
    listen 100.42.184.124:80;
    server_name jiran.jumanlady.com;

    access_log /usr/local/apache/domlogs/jumanlady.com.bytes bytes;
    access_log /usr/local/apache/domlogs/jumanlady.com.log combined;
    error_log /usr/local/apache/domlogs/jumanlady.com.error.log error;

    location /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /usr/local/apache/autossl_tmp;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 100.42.184.124:443 ssl http2;
    server_name jiran.jumanlady.com;

    access_log /usr/local/apache/domlogs/jumanlady.com.bytes bytes;
    access_log /usr/local/apache/domlogs/jumanlady.com.log combined;
    error_log /usr/local/apache/domlogs/jumanlady.com.error.log error;

    ssl_certificate      /etc/pki/tls/certs/jiran.jumanlady.com.bundle;
    ssl_certificate_key  /etc/pki/tls/private/jiran.jumanlady.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
